plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.pulseguard.app"
    compileSdk 35  // Android 15
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Camera2Interop / Camera2CameraControl (used to lock AE + AWB for a
        // clean PPG signal) are marked experimental in CameraX.
        freeCompilerArgs += [
            "-opt-in=androidx.camera.camera2.interop.ExperimentalCamera2Interop"
        ]
    }

    defaultConfig {
        applicationId "com.pulseguard.app"
        minSdk 26        // Android 8.0 Oreo (CameraX minimum)
        targetSdk 35     // Android 15 — full support
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // CameraX (core + lifecycle + camera2 interop)
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"

    // AndroidX core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
}
