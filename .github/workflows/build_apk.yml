name: Build PulseGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Android project wrapper
        run: |
          flutter create --platforms android --project-name pulse_guard .
          git checkout -- lib/ pubspec.yaml android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin/com/pulseguard/app/MainActivity.kt android/app/src/main/res/ android/build.gradle android/gradle.properties android/settings.gradle

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulseguard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
