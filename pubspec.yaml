name: pulse_guard
description: >
  Heart Rate & Blood Pressure measurement using smartphone camera PPG,
  based on FFT dual-channel analysis (Sharma et al., Elsevier 2022).

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Database (offline-first local storage)
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Charts & visualization
  fl_chart: ^0.68.0

  # Permissions
  permission_handler: ^11.3.0

  # Intl / date formatting
  intl: ^0.19.0

  # Share / export
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generation
  drift_dev: ^2.15.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
